<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equivalent Fractions Pizza Quiz – Grade 4</title>
<style>
  body { font-family: 'Comic Sans MS', system-ui, sans-serif; background: #fff8ec; margin: 0; padding: 2rem; text-align: center; }
  h1 { color: #c0392b; }
  .card { background: #fff; max-width: 560px; margin: 1rem auto; padding: 1.5rem; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-top: 1rem; }
  button { font-size: 1.25rem; padding: .8rem; border-radius: 12px; border: 2px solid #e67e22; background: #fff; cursor: pointer; }
  button.correct { background: #2ecc71; color: #fff; border-color: #27ae60; }
  button.wrong { background: #e74c3c; color: #fff; border-color: #c0392b; }
  #feedback { min-height: 1.5em; font-weight: bold; margin-top: 1rem; }
</style>
</head>
<body>
  <h1>🍕 Equivalent Fractions Pizza Quiz</h1>
  <p>Pick the fraction that is equal to the one on the pizza. Each correct answer earns a slice!</p>
  <div class="card">
    <p id="progress"></p>
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
    <p id="feedback"></p>
    <p>Score: <span id="score">0</span> · Best score: <span id="best">0</span></p>
    <button id="next" hidden>Next question</button>
  </div>
<script>
  const questions = [
    { q: "Which fraction is equivalent to 1/2?", options: ["2/4", "2/3", "1/3", "3/5"], answer: "2/4" },
    { q: "Which fraction is equivalent to 2/3?", options: ["4/6", "3/4", "2/6", "1/3"], answer: "4/6" },
    { q: "Which fraction is equivalent to 3/4?", options: ["6/8", "3/8", "4/3", "2/4"], answer: "6/8" },
    { q: "Which fraction is equivalent to 1/5?", options: ["2/10", "5/1", "1/10", "2/5"], answer: "2/10" },
    { q: "Which fraction has the same value as 4/8?", options: ["1/2", "1/4", "4/4", "8/4"], answer: "1/2" }
  ];
  let index = 0, score = 0;
  const best = Number(localStorage.getItem('pizzaBest') || 0);
  document.getElementById('best').textContent = best;
  function show() {
    const item = questions[index];
    document.getElementById('progress').textContent = `Question ${index + 1} of ${questions.length}`;
    document.getElementById('question').textContent = item.q;
    document.getElementById('feedback').textContent = '';
    document.getElementById('next').hidden = true;
    const box = document.getElementById('options');
    box.innerHTML = '';
    item.options.forEach(opt => {
      const b = document.createElement('button');
      b.textContent = opt;
      b.onclick = () => check(b, opt);
      box.appendChild(b);
    });
  }
  function check(btn, opt) {
    const item = questions[index];
    document.querySelectorAll('#options button').forEach(b => b.disabled = true);
    if (opt === item.answer) {
      btn.classList.add('correct');
      score++;
      document.getElementById('feedback').textContent = "Correct! Great job finding the equivalent fraction.";
    } else {
      btn.classList.add('wrong');
      document.getElementById('feedback').textContent = "Not quite — try multiplying the numerator and denominator by the same number.";
    }
    document.getElementById('score').textContent = score;
    if (score > Number(localStorage.getItem('pizzaBest') || 0)) localStorage.setItem('pizzaBest', score);
    document.getElementById('next').hidden = false;
  }
  document.getElementById('next').onclick = () => {
    index = (index + 1) % questions.length;
    show();
  };
  show();
</script>
</body>
</html>
